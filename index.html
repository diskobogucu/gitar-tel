<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Akor Cebi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Düzen: iOS gruplu liste mantığı. Büyük başlık + sağ üstte dişli, yuvarlak köşeli gruplar,
   altta bulanık "dock": üstte her ekranda duran mini metronom, altında 4 sekme. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface2:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.16); --seg-on:#ffffff;
  --ink:#000000; --muted:rgba(60,60,67,.6); --line:#c6c6c8;
  --accent:#007aff; --accent-ink:#ffffff; --root:#ff9500; --root-ink:#000000; --green:#34c759;
  --green-bg:rgba(52,199,89,.18); --green-ink:#248a3d; --red-bg:rgba(255,59,48,.16); --red-ink:#d70015;
  --tip-bg:rgba(0,122,255,.1); --scrim:rgba(0,0,0,.32);
  --bar:rgba(249,249,249,.88);
  --head:#2c2c2e; --neck:#4a3426; --nut:#efe9dc; --metal:#b9bcc4; --metal-hi:#e6e8ec;
  --wood1:#4a3326; --wood2:#2e1f17; --pearl:#efe9df; --fretw:#c9ccd2; --strc:#d9dbe0;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface2:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36); --seg-on:#636366;
    --ink:#ffffff; --muted:rgba(235,235,245,.6); --line:#38383a;
    --accent:#0a84ff; --root:#ff9f0a; --green:#30d158; --green-bg:rgba(48,209,88,.2); --green-ink:#30d158;
    --red-bg:rgba(255,69,58,.2); --red-ink:#ff453a; --tip-bg:rgba(10,132,255,.18); --scrim:rgba(0,0,0,.55);
    --bar:rgba(29,29,30,.88);
    --head:#3a3a3c; --neck:#3b2a1f; --nut:#d9d2c3; --metal:#8e9199; --metal-hi:#c7c9cf;
    --wood1:#3d2a1f; --wood2:#241811; --pearl:#e4ddd1; --fretw:#a9acb3; --strc:#c4c6cc;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface2:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36); --seg-on:#636366;
  --ink:#ffffff; --muted:rgba(235,235,245,.6); --line:#38383a;
  --accent:#0a84ff; --root:#ff9f0a; --green:#30d158; --green-bg:rgba(48,209,88,.2); --green-ink:#30d158;
  --red-bg:rgba(255,69,58,.2); --red-ink:#ff453a; --tip-bg:rgba(10,132,255,.18); --scrim:rgba(0,0,0,.55);
  --bar:rgba(29,29,30,.88);
  --head:#3a3a3c; --neck:#3b2a1f; --nut:#d9d2c3; --metal:#8e9199; --metal-hi:#c7c9cf;
  --wood1:#3d2a1f; --wood2:#241811; --pearl:#e4ddd1; --fretw:#a9acb3; --strc:#c4c6cc;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font:17px/1.3 var(--font); letter-spacing:-.01em;
  padding-block:8px 150px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.app{max-width:600px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:12px;min-width:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 2px}
.navr{display:flex;align-items:center;gap:4px}
.lt{font:700 34px/1.12 var(--font);letter-spacing:.2px;margin:0;min-width:0;overflow-wrap:anywhere}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--accent);border-radius:22px}
.iconbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sh{font:600 13px/1.2 var(--font);color:var(--muted);margin:10px 0 0 16px;letter-spacing:0}
.foot{font-size:13px;line-height:1.4;color:var(--muted);margin:0 16px;letter-spacing:0}
.tip{display:flex;align-items:center;gap:12px;background:var(--tip-bg);border-radius:12px;padding:10px 12px 10px 16px}
.tip p{margin:0;flex:1;font-size:15px;line-height:1.35;min-width:0}
.tip .link{flex:none;font-weight:600}

.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill2);border-radius:9px;padding:2px;gap:2px}
.segc button{min-height:34px;border-radius:7px;font-size:14px;font-weight:600;padding:0 8px}
.segc button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.22)}

.group{background:var(--surface);border-radius:12px;overflow:hidden;min-width:0}
.group.pad{padding:12px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px}
.row+.row{border-top:.5px solid var(--line)}
.row .lbl2{display:flex;flex-direction:column;min-width:0}
.row .lbl2 small{color:var(--accent);font-size:13px;font-weight:600}
.row .right{display:flex;align-items:center;gap:10px;color:var(--muted);flex:none}
.row output,.row .val{color:var(--muted);font-variant-numeric:tabular-nums}
.link{color:var(--accent);min-height:44px;font-size:17px}

.pill{min-height:40px;min-width:0;padding:0 6px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:16px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.posrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}

.card{background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tight{padding:12px 8px}
.card.tight>*:not(.dwrap){margin-inline:8px}
.cname{font:700 clamp(46px,15vw,60px)/1 var(--font);letter-spacing:-.03em;overflow-wrap:anywhere}
.csub{color:var(--muted);margin-top:4px;font-size:15px}
.cnotes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{padding:2px 9px;border-radius:7px;background:var(--surface2);font-size:14px;font-weight:600}
.note.r{background:var(--root);color:var(--root-ink)}
.hint{margin:0;text-align:center;color:var(--muted);font-size:13px}

/* Kaydırmalı seçiciler */
.rswipe{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:2px 4px;user-select:none;-webkit-user-select:none}
.rswipe .nb{height:56px}
.rc{grid-column:1/-1;text-align:center;min-width:0}
.rc .cnotes{justify-content:center}
.nb{height:44px;display:grid;place-items:center;color:var(--accent)}
.nb:disabled{opacity:.3;cursor:default}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.car{--base:clamp(46px,15vw,60px);position:relative;height:calc(var(--base) + 6px);overflow:hidden;min-width:0;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.car.sm{--base:clamp(34px,11vw,42px)}
.car.mini{--base:19px;height:40px;margin-top:2px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.car.mid{--base:24px;height:44px}
.car.icons{height:58px}
.car.icons .ci svg{height:52px;width:auto;display:block}
.ico-head{fill:currentColor;opacity:.9}
.ico-neck{fill:currentColor;opacity:.55}
.ico-peg{fill:currentColor}
.car.icons .ci[data-p="0"]{color:var(--accent)}
.car.icons .ci{color:var(--ink)}
.ci{position:absolute;left:50%;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font:700 var(--base)/1 var(--font);letter-spacing:-.03em;
  transform:translateX(-50%) translateX(calc(var(--p)*30%)) scale(var(--sc));opacity:var(--op);will-change:transform,opacity}
.car.mini .ci{font-size:var(--base);font-weight:600;letter-spacing:-.01em;padding:0 4px}
.car.mini .ci[data-p="0"]{color:var(--accent)}
.car.mid .ci{font-weight:700;letter-spacing:-.02em}
.car.mid .ci[data-p="0"]{color:var(--ink)}
.ci.l3{font-size:calc(var(--base)*.82)} .ci.l4{font-size:calc(var(--base)*.66)} .ci.l5{font-size:calc(var(--base)*.54)}
@keyframes soft{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion: no-preference){.soft{animation:soft .32s ease-out}}

/* Son akorlar */
.recent{display:flex;align-items:center;gap:10px;min-width:0}
.recent .rl{color:var(--muted);font-size:13px;font-weight:600;flex:none;padding-left:4px}
.rrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:2px 0}
.rrow::-webkit-scrollbar{display:none}
.rrow .cchip{background:var(--surface);flex:none}

/* Akor şeması */
.dwrap,.dwrap svg{touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dwrap{display:flex;justify-content:center}
.dwrap svg{cursor:pointer;width:100%;max-width:290px;height:auto;display:block}
.dwrap.wide svg{max-width:none}
.d-str.buzz{stroke:var(--accent)}
@keyframes buzz{0%{transform:translateX(-3px)}20%{transform:translateX(3px)}40%{transform:translateX(-2.2px)}60%{transform:translateX(1.6px)}80%{transform:translateX(-.8px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion: no-preference){.d-str.buzz{animation:buzz .38s linear}}
.d-fret{stroke:var(--line);stroke-width:1.3}
.d-nut{stroke:var(--ink);stroke-width:6}
.d-str{stroke:var(--muted)}
.d-inlay{fill:var(--surface2)}
.d-barre{fill:var(--accent)}
.d-dot{fill:var(--accent)} .d-dot.r{fill:var(--root)}
.d-num{fill:var(--accent-ink);font:700 15px var(--font);text-anchor:middle;dominant-baseline:central}
.d-num.r{fill:var(--root-ink)}
.d-open{fill:none;stroke:var(--muted);stroke-width:2.2} .d-open.r{stroke:var(--root);stroke-width:2.8}
.d-x{stroke:var(--muted);stroke-width:2.4;stroke-linecap:round}
.d-lab{fill:var(--muted);font:600 12px var(--font);text-anchor:middle}
.d-pos{fill:var(--ink);font:700 15px var(--font);text-anchor:end}
.vnav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.vlab{text-align:center;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.vlab strong{font-size:15px;font-weight:600}
.vlab span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* Klavye */
.fb-w1{stop-color:var(--wood1)} .fb-w2{stop-color:var(--wood2)}
.fb-fret{stroke:var(--fretw)}
.fb-nut{fill:var(--nut)}
.fb-str{stroke:var(--strc)}
.fb-inlay{fill:var(--pearl);opacity:.8}
.fb-num{fill:var(--muted);font-weight:600;text-anchor:middle;font-family:var(--font)}
.fb-lab{fill:var(--muted);font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:var(--font)}
.fb-hit{fill:transparent;cursor:pointer}
.fb-dot{fill:var(--accent);stroke:var(--wood2);stroke-width:1.5} .fb-dot.r{fill:var(--root)} .fb-dot.b{fill:var(--pearl);stroke:var(--accent);stroke-width:2.5}
.fb-t{fill:var(--accent-ink);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:var(--font)}
.fb-t.r{fill:var(--root-ink)} .fb-t.b{fill:var(--accent)}
.fb-faint{fill:var(--pearl);opacity:.28}
.fd .fb-dot{transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: no-preference){.fd.hit .fb-dot{animation:pop .3s ease-out}}
.fsbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;background:var(--tip-bg);color:var(--accent);font-weight:600;font-size:16px}
.fsbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Tam ekran klavye: dikey tutulursa içerik 90° döner, telefonu yana çevirince düz okunur. */
#fs{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden}
.fs-in{position:absolute;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:max(8px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px))}
@media (orientation: portrait){
  .fs-in{width:100vh;width:100dvh;height:100vw;transform-origin:top left;transform:translateX(100vw) rotate(90deg);padding:10px 14px}
  .fs-in.flip{transform:translateY(100vh) rotate(-90deg)}
}
.fs-top{display:flex;align-items:center;gap:8px;min-height:48px;overflow-x:auto;scrollbar-width:none}
.fs-top::-webkit-scrollbar{display:none}
.fs-title{display:flex;align-items:center;gap:0;font-weight:700;font-size:17px;white-space:nowrap;flex:none}
.fs-top .posrow{flex:none;display:flex;gap:6px}
.fs-top .posrow .pill{min-width:36px;padding:0 8px}
.fs-top .nb{width:32px}
.fs-deg{min-height:36px;padding:0 12px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:15px;flex:none}
.fs-deg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fs-top .posrow .pill{min-height:36px;font-size:15px}
.fs-top .segc{flex:none;min-width:170px}
.fs-sp{flex:1}
.fsx{width:40px;height:40px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;flex:none}
.fsx svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fs-board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.fs-board svg{width:100%;height:100%;display:block}

/* Arka plan müziği */
.bt-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bt-head>div{display:flex;flex-direction:column;min-width:0}
.bt-head b{font-size:19px;font-weight:700}
.bt-head span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.btplay{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;background:var(--green-bg);color:var(--green-ink);font-weight:700;font-size:16px;flex:none}
.btplay.on{background:var(--red-bg);color:var(--red-ink)}
.btchips{justify-content:center}
.cap{display:block;text-align:center;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:-6px}
.bchip{min-width:44px;padding:6px 10px;border-radius:9px;background:var(--surface2);font-weight:700;font-size:16px;text-align:center;transition:background .15s,color .15s}
.bchip.now{background:var(--accent);color:var(--accent-ink)}
.fs-now{min-width:64px;padding:6px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;text-align:center;flex:none}
.fs-now:empty{display:none}
.fsx.play{background:var(--green-bg)} .fsx.play svg{stroke:none;fill:var(--green-ink)}
.fsx.play.on{background:var(--red-bg)} .fsx.play.on svg{fill:var(--red-ink)}
.playing .fd:not(.ct) .fb-dot,.playing .fd:not(.ct) .fb-t{opacity:.45}
.fd.ct .fb-dot{stroke:var(--pearl);stroke-width:3}
.orow .oh .mini-play{margin-left:auto}
.mini-play{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:16px;background:var(--green-bg);color:var(--green-ink);font-weight:600;font-size:14px}

/* Ton akorları */
.krow{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;padding:8px 16px}
.krow+.krow{border-top:.5px solid var(--line)}
.kn{color:var(--muted);font-weight:600;font-size:15px}
.kchips{display:flex;gap:8px;flex-wrap:wrap}
.cchip{min-height:40px;min-width:48px;padding:0 12px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:18px}
.cchip.alt{background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.orow{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.orow+.orow{border-top:.5px solid var(--line)}
.oh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.oh strong{font-weight:600}
.oh span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

.stepper{display:inline-flex;background:var(--fill2);border-radius:8px;overflow:hidden;flex:none}
.stepper button{width:44px;height:32px;font-size:22px;font-weight:400;display:grid;place-items:center;color:var(--ink)}
.stepper button+button{border-left:1px solid var(--line)}
.empty{color:var(--muted);font-size:15px;margin:0}

/* Akort aleti */
.readout{text-align:center;min-height:108px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.rnote{font:700 68px/1 var(--font);letter-spacing:-.03em}
.rnote sub{font-size:26px;color:var(--muted);font-weight:600;letter-spacing:0}
.rhz{color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.rhint{font:700 24px/1.2 var(--font)}
.gwrap{display:flex;justify-content:center}
.gwrap svg{width:100%;max-width:330px;height:auto;display:block;user-select:none;-webkit-user-select:none}
.g-head{fill:var(--head)}
.g-slot{fill:var(--bg)}
.g-neck{fill:var(--neck)}
.g-fret{stroke:var(--metal);stroke-width:2}
.g-nut{fill:var(--nut)}
.g-str{fill:none;stroke:var(--metal-hi);stroke-linecap:round;stroke-linejoin:round}
.g-str.on{stroke:var(--accent)}
@keyframes vib{0%{transform:translateX(-.7px)}50%{transform:translateX(.7px)}100%{transform:translateX(-.7px)}}
@media (prefers-reduced-motion: no-preference){.g-str.on{animation:vib .07s linear infinite}}
.g-shaft{stroke:var(--metal);stroke-width:4;stroke-linecap:round}
.g-post{fill:var(--metal-hi);stroke:var(--metal);stroke-width:1.5}
.peg{cursor:pointer}
.peg .pk{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.peg .pt{fill:var(--ink);font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:var(--font);pointer-events:none}
.peg .po{fill:var(--muted);font-weight:600}
.peg.on .pk{fill:var(--accent);stroke:var(--accent)}
.peg.on .pt,.peg.on .po{fill:var(--accent-ink)}
@keyframes ring{from{transform:scale(1);opacity:.75}to{transform:scale(1.45);opacity:0}}
.peg .halo{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){.peg.on .halo{animation:ring 1.4s ease-out infinite}}
.peg:focus-visible .pk{stroke:var(--accent);stroke-width:3}

/* Metronom */
.mcard{align-items:center;text-align:center;gap:12px}
.bpmbig{display:flex;align-items:baseline;justify-content:center;gap:8px}
.bpmbig output{font:700 84px/1 var(--font);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bpmbig span{color:var(--muted);font-weight:600}
.bdots{display:flex;gap:12px;justify-content:center;min-height:20px}
.bdot{width:20px;height:20px;border-radius:50%;background:var(--fill2);display:block}
.bdot.on{background:var(--accent)} .bdot.on.first{background:var(--root)}
.mslider{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;width:100%}
.mslider input{width:100%;height:32px;accent-color:var(--accent);margin:0}
.rnd{width:44px;height:44px;border-radius:50%;background:var(--surface2);font-size:24px;display:grid;place-items:center}
.mcard .segc{width:100%}

/* Alt dock: mini metronom + sekmeler */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);

/* Alt sayfa */
.sheet-wrap{position:fixed;inset:0;z-index:40}

.sheet{position:absolute;left:0;right:0;bottom:0;margin-inline:auto;max-width:600px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;

<script>
/* ---------- Müzik mantığı ---------- */
const NAMES={
  ls:['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],
  lf:['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'],
  ss:['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'],
  sf:['Do','Re♭','Re','Mi♭','Mi','Fa','Sol♭','Sol','La♭','La','Si♭','Si']
};
const state={
  tab:'akort',sheet:null,fs:false,fsFlip:false,
  solfege:false,flat:false,lefty:false,awake:true,tips:{},
  root:9,q:'m',vi:0,recent:[],sc:null,
  sRoot:9,sType:'pentm',sPos:0,sLab:'note',
  inst:'k33',tunI:0,a4:440,toneI:-1,
  bpm:100,sig:'4',pat:0,patChord:true,btProg:0,btStyle:0,
  songs:[],songId:null,editing:false,auto:false,autoSp:2
};
const nm=pc=>NAMES[(state.solfege?'s':'l')+(state.flat?'f':'s')][((pc%12)+12)%12];
const mod=(n,m)=>((n%m)+m)%m;
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));

const OPEN=[4,9,2,7,11,4];          // 6. telden 1. tele: Mi La Re Sol Si Mi
const MIDI=[40,45,50,55,59,64];
const QT=[
  {k:'',    lab:'Majör', ln:'Majör',       tr:'majör',       sym:'',     iv:[0,4,7]},
  {k:'m',   lab:'Minör', ln:'Minör',       tr:'minör',       sym:'m',    iv:[0,3,7]},
  {k:'7',   lab:'7',     ln:'Dominant 7',  tr:'dominant 7',  sym:'7',    iv:[0,4,7,10]},
  {k:'maj7',lab:'maj7',  ln:'Majör 7',     tr:'majör 7',     sym:'maj7', iv:[0,4,7,11]},
  {k:'m7',  lab:'m7',    ln:'Minör 7',     tr:'minör 7',     sym:'m7',   iv:[0,3,7,10]},
  {k:'sus2',lab:'sus2',  ln:'Sus2',        tr:'sus2',        sym:'sus2', iv:[0,2,7]},
  {k:'sus4',lab:'sus4',  ln:'Sus4',        tr:'sus4',        sym:'sus4', iv:[0,5,7]},
  {k:'dim', lab:'dim',   ln:'Azaltılmış',  tr:'azaltılmış',  sym:'dim',  iv:[0,3,6]},
  {k:'aug', lab:'aug',   ln:'Artırılmış',  tr:'artırılmış',  sym:'aug',  iv:[0,4,8]},
  {k:'6',   lab:'6',     ln:'Majör 6',     tr:'majör 6',     sym:'6',    iv:[0,4,7,9]},
  {k:'5',   lab:'5',     ln:'Power chord', tr:'power chord', sym:'5',    iv:[0,7]}
];
const QBY=Object.fromEntries(QT.map(q=>[q.k,q]));

/* Taşınabilir şekiller: rel = köke göre perde (-1 = çalınmaz), f = parmak, rs = kök teli (0 = 6. tel) */
const SH={
  '':[{rs:0,rel:[0,2,2,1,0,0],f:[1,3,4,2,1,1]},{rs:1,rel:[-1,0,2,2,2,0],f:[0,1,3,3,3,1]}],
  'm':[{rs:0,rel:[0,2,2,0,0,0],f:[1,3,4,1,1,1]},{rs:1,rel:[-1,0,2,2,1,0],f:[0,1,3,4,2,1]}],
  '7':[{rs:0,rel:[0,2,0,1,0,0],f:[1,3,1,2,1,1]},{rs:1,rel:[-1,0,2,0,2,0],f:[0,1,3,1,4,1]}],
  'maj7':[{rs:0,rel:[0,2,1,1,0,0],f:[1,4,2,3,1,1]},{rs:1,rel:[-1,0,2,1,2,0],f:[0,1,3,2,4,1]}],
  'm7':[{rs:0,rel:[0,2,0,0,0,0],f:[1,3,1,1,1,1]},{rs:1,rel:[-1,0,2,0,1,0],f:[0,1,3,1,2,1]}],
  'sus2':[{rs:1,rel:[-1,0,2,2,0,0],f:[0,1,3,4,1,1]}],
  'sus4':[{rs:0,rel:[0,2,2,2,0,0],f:[1,2,3,4,1,1]},{rs:1,rel:[-1,0,2,2,3,0],f:[0,1,2,3,4,1]}],
  'dim':[{rs:1,rel:[-1,0,1,2,1,-1],f:[0,1,2,4,3,0]}],
  'aug':[{rs:2,rel:[-1,-1,0,3,3,2],f:[0,0,1,4,4,2]}],
  '6':[{rs:0,rel:[0,2,2,1,2,0],f:[1,3,4,2,4,1]},{rs:1,rel:[-1,0,2,2,2,2],f:[0,1,3,3,3,3]}],
  '5':[{rs:0,rel:[0,2,2,-1,-1,-1],f:[1,3,4,0,0,0]},{rs:1,rel:[-1,0,2,2,-1,-1],f:[0,1,3,4,0,0]}]
};
/* Açık pozisyon akorları: r = kök (0 = Do), mutlak perde ve parmak numaraları */
const OPENV=[
  {r:0,q:'',f:[-1,3,2,0,1,0],g:[0,3,2,0,1,0]},
  {r:9,q:'',f:[-1,0,2,2,2,0],g:[0,0,1,2,3,0]},
  {r:7,q:'',f:[3,2,0,0,0,3],g:[2,1,0,0,0,3]},
  {r:7,q:'',f:[3,2,0,0,3,3],g:[2,1,0,0,3,4]},
  {r:4,q:'',f:[0,2,2,1,0,0],g:[0,2,3,1,0,0]},
  {r:2,q:'',f:[-1,-1,0,2,3,2],g:[0,0,0,1,3,2]},
  {r:9,q:'m',f:[-1,0,2,2,1,0],g:[0,0,2,3,1,0]},
  {r:4,q:'m',f:[0,2,2,0,0,0],g:[0,2,3,0,0,0]},
  {r:2,q:'m',f:[-1,-1,0,2,3,1],g:[0,0,0,2,3,1]},
  {r:9,q:'7',f:[-1,0,2,0,2,0],g:[0,0,2,0,3,0]},
  {r:4,q:'7',f:[0,2,0,1,0,0],g:[0,2,0,1,0,0]},
  {r:2,q:'7',f:[-1,-1,0,2,1,2],g:[0,0,0,2,1,3]},
  {r:7,q:'7',f:[3,2,0,0,0,1],g:[3,2,0,0,0,1]},
  {r:0,q:'7',f:[-1,3,2,3,1,0],g:[0,3,2,4,1,0]},
  {r:11,q:'7',f:[-1,2,1,2,0,2],g:[0,2,1,3,0,4]},
  {r:0,q:'maj7',f:[-1,3,2,0,0,0],g:[0,3,2,0,0,0]},
  {r:5,q:'maj7',f:[-1,-1,3,2,1,0],g:[0,0,4,3,2,0]},
  {r:9,q:'maj7',f:[-1,0,2,1,2,0],g:[0,0,2,1,3,0]},
  {r:2,q:'maj7',f:[-1,-1,0,2,2,2],g:[0,0,0,1,1,1]},
  {r:7,q:'maj7',f:[3,2,0,0,0,2],g:[3,2,0,0,0,1]},
  {r:4,q:'m7',f:[0,2,0,0,0,0],g:[0,2,0,0,0,0]},
  {r:4,q:'m7',f:[0,2,2,0,3,0],g:[0,1,2,0,3,0]},
  {r:9,q:'m7',f:[-1,0,2,0,1,0],g:[0,0,2,0,1,0]},
  {r:2,q:'m7',f:[-1,-1,0,2,1,1],g:[0,0,0,2,1,1]},
  {r:9,q:'sus2',f:[-1,0,2,2,0,0],g:[0,0,1,2,0,0]},
  {r:2,q:'sus2',f:[-1,-1,0,2,3,0],g:[0,0,0,2,3,0]},
  {r:9,q:'sus4',f:[-1,0,2,2,3,0],g:[0,0,1,2,3,0]},
  {r:2,q:'sus4',f:[-1,-1,0,2,3,3],g:[0,0,0,1,3,4]},
  {r:4,q:'sus4',f:[0,2,2,2,0,0],g:[0,2,3,4,0,0]}
];
const OPENKEYS=new Set(OPENV.map(o=>o.r+'|'+o.q));

function voicings(root,q){
  const out=[],seen=new Set();
  const add=v=>{const k=v.frets.join(',');if(!seen.has(k)){seen.add(k);out.push(v);}};
  const opens=OPENV.filter(o=>o.r===root&&o.q===q);
  opens.forEach(o=>add({frets:o.f,fingers:o.g,label:'Açık pozisyon',pos:0}));
  const mv=[];
  (SH[q]||[]).forEach(sh=>{
    const p0=mod(root-OPEN[sh.rs],12);
    const cands=p0===0?(opens.length?[12]:[0,12]):[p0];
    cands.forEach(p=>{
      const frets=sh.rel.map(r=>r<0?-1:r+p);
      if(Math.max(...frets)>15) return;
      mv.push({frets,fingers:sh.f,pos:p,label:(p===0?'Açık pozisyon':p+'. perde')+' · kök '+(6-sh.rs)+'. telde'});
    });
  });
  mv.sort((a,b)=>a.pos-b.pos).forEach(add);
  return out;
}
function shapeLabels(vs){
  const base=vs.map(v=>v.pos===0?'Açık':v.pos+'. perde'), seen={};
  return base.map(b=>{seen[b]=(seen[b]||0)+1;return seen[b]>1?b+' ('+seen[b]+')':b;});
}

const NOTE_RE='(Do|Re|Mi|Fa|Sol|La|Si|[A-G])([#b♯♭]?)';
const CHORD_RE=new RegExp('^'+NOTE_RE+'(.*?)(?:/'+NOTE_RE+')?$');
const BASE={Do:0,Re:2,Mi:4,Fa:5,Sol:7,La:9,Si:11,C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const QMAP={'':'','maj':'','M':'','m':'m','min':'m','-':'m','7':'7','dom7':'7','maj7':'maj7','M7':'maj7','Δ':'maj7','Δ7':'maj7','m7':'m7','min7':'m7','-7':'m7','sus2':'sus2','sus4':'sus4','sus':'sus4','dim':'dim','°':'dim','aug':'aug','+':'aug','6':'6','5':'5'};
const LC=['maj7','maj','min','min7','dim','aug','sus2','sus4','sus'];
function pcOf(n,acc){let p=BASE[n];if(acc==='#'||acc==='♯')p++;else if(acc==='b'||acc==='♭')p--;return mod(p,12);}
function parseTok(t){
  if(t.length>12) return null;
  const m=CHORD_RE.exec(t); if(!m) return null;
  const raw=m[3];
  let q,known=true;
  if(raw in QMAP) q=QMAP[raw];
  else if(LC.includes(raw.toLowerCase())) q=QMAP[raw.toLowerCase()];
  else{
    if(!/^(m|M|maj|min|add|sus|dim|aug|\+|-|°|Δ|\d|\()/.test(raw)) return null;
    if(!/^[A-Za-z0-9+\-°Δ#♯♭()]*$/.test(raw)) return null;
    known=false;
    q=/^m(?!aj)/.test(raw)?'m':(/^(7|9|11|13)/.test(raw)?'7':'');
  }
  return {r:pcOf(m[1],m[2]),q,known,suf:known?QBY[q].sym:raw,b:m[4]?pcOf(m[4],m[5]):null};
}

  {k:'major',n:'Majör',sn:'Majör',iv:[0,2,4,5,7,9,11],deg:['1','2','3','4','5','6','7'],parent:'major'},
  {k:'minor',n:'Doğal minör',sn:'Minör',iv:[0,2,3,5,7,8,10],deg:['1','2','♭3','4','5','♭6','♭7'],parent:'minor'},
  {k:'dorian',n:'Dorian',sn:'Dorian',iv:[0,2,3,5,7,9,10],deg:['1','2','♭3','4','5','6','♭7'],parent:'dorian'},
  {k:'mixo',n:'Mixolydian',sn:'Mixolydian',iv:[0,2,4,5,7,9,10],deg:['1','2','3','4','5','6','♭7'],parent:'mixo'},
  {k:'harm',n:'Harmonik minör',sn:'Harm. minör',iv:[0,2,3,5,7,8,11],deg:['1','2','♭3','4','5','♭6','7'],parent:'harm'}
];
const SBY=Object.fromEntries(SCALES.map(s=>[s.k,s]));
const scaleSet=(root,sc)=>new Set(sc.iv.map(i=>(root+i)%12));
/* Pozisyon = 5 perdelik pencere; gamın bir notasının 6. teldeki perdesinden bir perde önce başlar. */
function positions(root,sc){
  const set=scaleSet(root,sc);
  const base=new Set((sc.base||sc.iv).map(i=>(root+i)%12));
  const starts=[...new Set([...base].map(pc=>mod(pc-OPEN[0],12)))].sort((a,b)=>a-b);
  return starts.map(f6=>{
    const lo=Math.max(0,f6-1),hi=lo+4,cells=[];
    for(let s=0;s<6;s++)for(let f=lo;f<=hi;f++)if(set.has((OPEN[s]+f)%12)) cells.push([s,f]);
    const fs=cells.map(c=>c[1]);
    return {f6,cells,lo:Math.min(...fs),hi:Math.max(...fs)};
  });
}
/* 7 sesli bir gamın üzerine üçlü ve dörtlü akorlar kurar. */
const TRI={'4,7':'','3,7':'m','3,6':'dim','4,8':'aug'};
const SEV={'4,7,11':'maj7','4,7,10':'7','3,7,10':'m7'};
const ROMAN=['I','II','III','IV','V','VI','VII'];
function diatonic(root,sc){
  const iv=sc.iv, at=k=>iv[k%7]+(k>=7?12:0);
  return iv.map((a,d)=>{
    const t1=at(d+2)-a,t2=at(d+4)-a,t3=at(d+6)-a;
    const q=TRI[t1+','+t2]; const q7=SEV[t1+','+t2+','+t3]||null;
    let n=ROMAN[d]; if(q==='m'||q==='dim') n=n.toLowerCase(); if(q==='dim') n+='°'; if(q==='aug') n+='+';
    return {n,r:(root+a)%12,q:q===undefined?'':q,q7};
  });
}

PROGS.mixo=[{n:'Mixolydian vamp',d:'I VII IV I',c:[[0,''],[10,''],[5,''],[0,'']]},{n:'Funk',d:'I7 IV',c:[[0,'7'],[5,'']]}];
PROGS.harm=[{n:'Harmonik',d:'i iv V i',c:[[0,'m'],[5,'m'],[7,'7'],[0,'m']]},{n:'Flamenko',d:'i VII VI V',c:[[0,'m'],[10,''],[8,''],[7,'7']]}];
const progChords=(root,key)=>(PROGS[key]||[]).map(p=>({n:p.n,d:p.d,c:p.c.map(([o,q])=>({r:mod(root+o,12),q}))}));

<script>
/* ---------- Arayüz ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=['akort','akorlar','ton','sarki'];
const CHEV_L='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const CHEV_R='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';

const SAMPLE_SONG={id:'ornek',title:'Örnek: Yaz Akşamı',tr:0,capo:0,bpm:84,text:
'[Am]Akşam iner [F]sahile yavaş\n[C]Dalgalar söy[G]ler eski bir şarkı\n[Am]Sen gelirsin [F]rüzgârla beraber\n[E7]Ben beklerim [Am]aynı yerde\n\nNakarat\nF G C Am\nF G E7 Am'};

/* ---------- Kayıt ---------- */
function save(){
  try{localStorage.setItem('akorcebi',JSON.stringify({
    v:2,tab:state.tab,solfege:state.solfege,flat:state.flat,lefty:state.lefty,awake:state.awake,tips:state.tips,
    root:state.root,q:state.q,recent:state.recent,sRoot:state.sRoot,sType:state.sType,sLab:state.sLab,
    inst:state.inst,tunI:state.tunI,a4:state.a4,bpm:state.bpm,sig:state.sig,pat:state.pat,patChord:state.patChord,btProg:state.btProg,btStyle:state.btStyle,
    songs:state.songs,autoSp:state.autoSp
  }));}catch(e){}
}
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem('akorcebi')||'null');}catch(e){}
  state.songs=[{...SAMPLE_SONG}];
  if(!d||typeof d!=='object') return;
  const int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b, str=(v,n)=>typeof v==='string'&&v.length<=n;
  if(TABS.includes(d.tab)) state.tab=d.tab;
  state.solfege=!!d.solfege; state.flat=!!d.flat; state.lefty=!!d.lefty; if(typeof d.awake==='boolean') state.awake=d.awake;
  if(d.tips&&typeof d.tips==='object') for(const k of ['akort','akorlar','ton','sarki']) if(d.tips[k]===true) state.tips[k]=true;
  if(int(d.root,0,11)) state.root=d.root;
  if(typeof d.q==='string'&&d.q in QBY) state.q=d.q;
  if(Array.isArray(d.recent)) state.recent=d.recent.filter(x=>typeof x==='string'&&/^\d{1,2}\|[a-z0-9]*$/.test(x)&&+x.split('|')[0]<12&&x.split('|')[1] in QBY).slice(0,8);
  if(int(d.sRoot,0,11)) state.sRoot=d.sRoot;
  if(typeof d.sType==='string'&&d.sType in SBY) state.sType=d.sType;
  if(d.sLab==='note'||d.sLab==='deg') state.sLab=d.sLab;
  const oldInst={akustik:'k33',klasik:'k33',elektrik:'k6'};
  if(typeof d.inst==='string'&&d.inst in oldInst) state.inst=oldInst[d.inst];
  else if(typeof d.inst==='string'&&INST.some(x=>x.k===d.inst)) state.inst=d.inst;
  if(int(d.tunI,0,9)) state.tunI=d.tunI;
  if(int(d.a4,430,450)) state.a4=d.a4;
  if(int(d.bpm,30,240)) state.bpm=d.bpm;
  if(typeof d.sig==='string'&&d.sig in SIGS) state.sig=d.sig;
  if(int(d.pat,0,9)&&d.pat<PATS[state.sig].length) state.pat=d.pat;
  if(typeof d.patChord==='boolean') state.patChord=d.patChord;
  if(int(d.btProg,0,9)) state.btProg=d.btProg;
  if(int(d.btStyle,0,STYLES.length-1)) state.btStyle=d.btStyle;
  if(int(d.autoSp,1,5)) state.autoSp=d.autoSp;
  if(Array.isArray(d.songs)){
    state.songs=d.songs.filter(s=>s&&str(s.id,40)&&str(s.title,200)&&str(s.text,20000)).slice(0,200).map(s=>({
      id:s.id,title:s.title,text:s.text,tr:int(s.tr,-11,11)?s.tr:0,capo:int(s.capo,0,9)?s.capo:0,bpm:int(s.bpm,30,240)?s.bpm:90
    }));
  }
}

/* ---------- Kaydırmalı seçiciler ----------
   Ortadaki öğe seçili; komşular küçülüp silikleşir. off: parmağın sürüklediği kesirli kayma (1 = bir öğe). */
const RP={big:{s1:.48,o1:.32,div:3},mini:{s1:.74,o1:.45,div:2.8},mid:{s1:.6,o1:.4,div:2.3},icons:{s1:.66,o1:.42,div:4.2}};
const rpOf=c=>c.classList.contains('icons')?RP.icons:c.classList.contains('mid')?RP.mid:c.classList.contains('mini')?RP.mini:RP.big;
function roleAt(a,R){
  if(a<=1) return {s:1-(1-R.s1)*a,o:1-(1-R.o1)*a};
  const t=Math.min(a-1,1); return {s:R.s1*(1-.35*t),o:R.o1*(1-t)};
}
const lenCls=t=>{const n=[...t].length;return n<=2?'':n===3?' l3':n===4?' l4':' l5';};
function carousel(k,fn,kind){
  const isMini=!!kind&&(kind.includes('mini')||kind.includes('icons')), R=RP[kind&&kind.includes('icons')?'icons':kind&&kind.includes('mid')?'mid':isMini?'mini':'big'];
  let h=`<div class="car${kind?' '+kind:''}" data-k="${k}">`;
  for(let p=-2;p<=2;p++){
    const r=roleAt(Math.abs(p),R), t=fn(p);
    h+=`<span class="ci${isMini?'':lenCls(t)}" data-p="${p}" style="--p:${p};--sc:${r.s};--op:${r.o}"${p?' aria-hidden="true"':''}>${t}</span>`;
  }
  return h+'</div>';
}
const swipeHead=(k,fn,below,kind)=>`<div class="rswipe" data-k="${k}"><button class="nb" data-act="rstep" data-k="${k}" data-v="-1" aria-label="Önceki">${CHEV_L}</button>${carousel(k,fn,kind)}<button class="nb" data-act="rstep" data-k="${k}" data-v="1" aria-label="Sonraki">${CHEV_R}</button><div class="rc">${below}</div></div>`;
function layoutCar(c,off){
  const w=c.clientWidth; if(!w) return;
  const R=rpOf(c), cw=w/R.div;
  c.querySelectorAll('.ci').forEach(el=>{
    const q=+el.dataset.p+off, r=roleAt(Math.abs(q),R);
    el.style.transform=`translateX(-50%) translateX(${(q*cw).toFixed(2)}px) scale(${r.s.toFixed(4)})`;
    el.style.opacity=r.o.toFixed(3);
  });
}
const carOff={};
function fixCars(){document.querySelectorAll('.car').forEach(c=>layoutCar(c,carOff[c.dataset.k]||0));}
const carEl=k=>document.querySelector('.car[data-k="'+k+'"]');
const reduceMotion=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const tweens={};
/* Bırakınca ya da oka basınca yumuşakça yerine oturur. */
function settle(k,from){
  const tok={}; tweens[k]=tok;
  if(reduceMotion()||!from){carOff[k]=0;const c=carEl(k);if(c) layoutCar(c,0);return;}
  const t0=performance.now(), dur=Math.min(620,380+Math.abs(from)*120);
  const ease=t=>1-Math.pow(1-t,4);
  const f=now=>{
    if(tweens[k]!==tok) return;
    const t=Math.min(1,(now-t0)/dur), off=from*(1-ease(t));
    carOff[k]=off; const c=carEl(k); if(c) layoutCar(c,off);
    if(t<1) requestAnimationFrame(f); else carOff[k]=0;
  };
  requestAnimationFrame(f);
}
const tip=(id,text)=>state.tips[id]?'':`<div class="tip"><p>${text}</p><button class="link" data-act="tip" data-v="${id}">Tamam</button></div>`;
const chordName=(r,q)=>nm(r)+QBY[q].sym;
const chip=(c,cls)=>`<button class="cchip${cls?' '+cls:''}" data-act="chord" data-root="${c.r}" data-q="${c.q}">${chordName(c.r,c.q)}</button>`;

/* ---------- Akor şeması ---------- */
function diagram(v,root){
  const W=240,H=314,x0=52,sx=30,top=64,fh=42,nf=5,L=state.lefty;
  const fr=v.frets,fg=v.fingers;
  const pos=fr.filter(f=>f>0);
  const mx=pos.length?Math.max(...pos):0, mn=pos.length?Math.min(...pos):1;
  const start=mx<=5?1:mn;
  const isRoot=i=>fr[i]>=0&&(OPEN[i]+fr[i])%12===root;
  const X=i=>x0+(L?5-i:i)*sx;
  const Y=f=>top+(f-start+.5)*fh;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(v.label)}">`;
  for(let f=start;f<start+nf;f++){
    const y=Y(f);
    if(f===12) s+=`<circle class="d-inlay" cx="${x0+1.5*sx}" cy="${y}" r="7"/><circle class="d-inlay" cx="${x0+3.5*sx}" cy="${y}" r="7"/>`;
    else if([3,5,7,9,15].includes(f)) s+=`<circle class="d-inlay" cx="${x0+2.5*sx}" cy="${y}" r="7"/>`;
  }
  for(let i=0;i<=nf;i++){
    const y=top+i*fh;
    s+=i===0&&start===1?`<line class="d-nut" x1="${x0-3}" x2="${x0+5*sx+3}" y1="${y-1}" y2="${y-1}"/>`:`<line class="d-fret" x1="${x0}" x2="${x0+5*sx}" y1="${y}" y2="${y}"/>`;
  }
  const sw=[2.6,2.1,1.7,1.4,1.1,.9];
  for(let i=0;i<6;i++) s+=`<line class="d-str" data-s="${i}" x1="${X(i)}" x2="${X(i)}" y1="${top}" y2="${top+nf*fh}" stroke-width="${sw[i]}"/>`;
  if(start>1) s+=L?`<text class="d-pos" x="${x0+5*sx+34}" y="${top+fh/2+5}">${start}.</text>`:`<text class="d-pos" x="${x0-16}" y="${top+fh/2+5}">${start}.</text>`;
  for(let i=0;i<6;i++){
    if(fr[i]===-1) s+=`<path class="d-x" d="M${X(i)-6} ${top-24}l12 12M${X(i)+6} ${top-24}l-12 12"/>`;
    else if(fr[i]===0) s+=`<circle class="d-open${isRoot(i)?' r':''}" cx="${X(i)}" cy="${top-18}" r="6"/>`;
  }
  const b=fr.map((f,i)=>f>0&&fg[i]===1?i:-1).filter(i=>i>=0);
  let barre=null;
  if(b.length>=2&&b.every(i=>fr[i]===fr[b[0]])) barre={a:b[0],z:b[b.length-1],f:fr[b[0]]};
  if(barre){
    const y=Y(barre.f), xa=X(barre.a), xz=X(barre.z);
    s+=`<rect class="d-barre" x="${Math.min(xa,xz)-12}" y="${y-12}" width="${Math.abs(xz-xa)+24}" height="24" rx="12"/>`;
    b.forEach(i=>{
      if(isRoot(i)) s+=`<circle class="d-dot r" cx="${X(i)}" cy="${y}" r="12"/><text class="d-num r" x="${X(i)}" y="${y+1}">1</text>`;
    });
    if(!isRoot(barre.a)) s+=`<text class="d-num" x="${xa}" y="${y+1}">1</text>`;
  }
  for(let i=0;i<6;i++){
    if(fr[i]<=0) continue;
    if(barre&&fg[i]===1&&fr[i]===barre.f) continue;
    const r=isRoot(i), y=Y(fr[i]);
    s+=`<circle class="d-dot${r?' r':''}" cx="${X(i)}" cy="${y}" r="12"/>`;
    if(fg[i]>0) s+=`<text class="d-num${r?' r':''}" x="${X(i)}" y="${y+1}">${fg[i]}</text>`;
  }
  for(let i=0;i<6;i++) s+=`<text class="d-lab" x="${X(i)}" y="${H-8}">${nm(OPEN[i])}</text>`;
  s+='</svg>';
  return {svg:s,barre:!!barre};
}

/* Klavye: ince Mi teli üstte. real=true ise perde aralıkları gerçek gitardaki gibi daralır. Solak modda yatay aynalanır. */
function board(root,sc,pos,o){
  const N=o.N,W=o.W,H=o.H,L=state.lefty,id=o.id;
  const x0=o.openW,x1=W-10,top=o.top,bot=H-o.bot,sp=(bot-top)/5;
  const tot=1-Math.pow(2,-N/12);
  const fx=n=>o.real?x0+(x1-x0)*(1-Math.pow(2,-n/12))/tot:x0+(x1-x0)*n/N;
  const MX=x=>L?W-x:x, Y=s=>top+(5-s)*sp;
  const set=scaleSet(root,sc), blue=sc.blue!=null?(root+sc.blue)%12:-1;
  const inPos=pos?new Set(pos.cells.map(c=>c[0]+','+c[1])):null;
  const minW=fx(N)-fx(N-1), r=Math.min(o.rmax,sp*.42,minW*.44);
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(nm(root)+' '+sc.n)} klavyede">`;
  s+=`<defs><linearGradient id="wd${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="fb-w1"/><stop offset="1" class="fb-w2"/></linearGradient></defs>`;
  const bx=Math.min(MX(x0),MX(x1));
  s+=`<rect x="${bx}" y="${top-sp*.55}" width="${x1-x0}" height="${5*sp+sp*1.1}" fill="url(#wd${id})" rx="3"/>`;
  const mid=n=>(fx(n-1)+fx(n))/2, iy=(top+bot)/2, ir=Math.min(sp*.22,7);
  [3,5,7,9,15].forEach(f=>{if(f<=N) s+=`<circle class="fb-inlay" cx="${MX(mid(f))}" cy="${iy}" r="${ir}"/>`;});
  if(N>=12) s+=`<circle class="fb-inlay" cx="${MX(mid(12))}" cy="${top+1.5*sp}" r="${ir}"/><circle class="fb-inlay" cx="${MX(mid(12))}" cy="${top+3.5*sp}" r="${ir}"/>`;
  for(let n=1;n<=N;n++) s+=`<line class="fb-fret" x1="${MX(fx(n))}" x2="${MX(fx(n))}" y1="${top-sp*.55}" y2="${bot+sp*.55}" stroke-width="${o.real?3:2}"/>`;
  s+=`<rect class="fb-nut" x="${L?MX(x0):MX(x0)-o.nutW}" y="${top-sp*.55}" width="${o.nutW}" height="${5*sp+sp*1.1}"/>`;
  const sw=o.real?[3.4,2.8,2.2,1.7,1.3,1]:[2.4,2,1.6,1.3,1,.8];
  for(let i=0;i<6;i++) s+=`<line class="fb-str" x1="${MX(x0-o.openW*.7)}" x2="${MX(x1)}" y1="${Y(i)}" y2="${Y(i)}" stroke-width="${sw[i]}"/>`;
  for(let i=0;i<6;i++) s+=`<text class="fb-lab" x="${MX(o.openW*.14)}" y="${Y(i)}" font-size="${o.fs*.95}">${nm(OPEN[i])}</text>`;
  [3,5,7,9,12,15].forEach(f=>{if(f<=N) s+=`<text class="fb-num" x="${MX(mid(f))}" y="${H-4}" font-size="${o.fs}">${f}</text>`;});
  let dots='';
  for(let st=0;st<6;st++)for(let f=0;f<=N;f++){
    const pc=(OPEN[st]+f)%12;
    if(!set.has(pc)) continue;
    const cx=MX(f===0?x0-o.openW*.42:mid(f)), cy=Y(st);
    if(inPos&&!inPos.has(st+','+f)){dots+=`<circle class="fb-faint" cx="${cx}" cy="${cy}" r="${r*.38}"/>`;continue;}
    const iv=mod(pc-root,12), idx=sc.iv.indexOf(iv);
    const lab=state.sLab==='deg'?sc.deg[idx]:nm(pc);
    const cls=pc===root?' r':(pc===blue?' b':'');
    const n=[...lab].length, fs=r*(n<=1?1.1:n===2?.95:n===3?.74:.62);
    dots+=`<g class="fd" data-s="${st}" data-f="${f}"><circle class="fb-hit" cx="${cx}" cy="${cy}" r="${r*1.3}"/><circle class="fb-dot${cls}" cx="${cx}" cy="${cy}" r="${r}"/><text class="fb-t${cls}" x="${cx}" y="${cy+r*.04}" font-size="${fs.toFixed(1)}">${lab}</text></g>`;
  }
  return s+dots+'</svg>';
}

const noteOct=m=>`${nm(m)}<tspan class="po" font-size="0.62em" dy="0.25em">${Math.floor(m/12)-1}</tspan>`;
function strLabel(I,T,i){

/* Kafa ve burgu çizimi: gitar dik, kafa yukarıda; teller soldan sağa kalından inceye. */
function headSVG(I,T,sel){
  const W=300,H=410,cx=150,y0=14,yN=318,nc=I.nc,n=T.m.length;
  const nw=({4:56,5:72,6:70,7:84}[nc]||70)+(I.bass?10:0);
  const inline=I.shape==='inline';
  const headW=I.pairs?134:(nc===4&&!inline?104:120);
  const xL=inline?cx-nw/2-60:cx-headW/2, xR=inline?cx+nw/2+12:cx+headW/2;
  const yA=inline||I.pairs?y0+32:y0+50, yB=inline||I.pairs?yN-82:yN-96;
  const gap=Math.min(60,(yB-yA)/Math.max(Math.max(I.L.length,I.R.length)-1,1)), yC=(yA+yB)/2;
  const pegY=(k,j)=>k===1?yC:yC-(k-1)*gap/2+j*gap;
  const r=Math.min(21,gap*.46);
  const peg={};
  I.L.forEach((si,j)=>{peg[si]={px:xL+22,kx:xL-r-6,y:pegY(I.L.length,j)};});
  I.R.forEach((si,j)=>{peg[si]={px:xR-22,kx:xR+r+6,y:pegY(I.R.length,j)};});
  const nutX=i=>{const c=course(I,i);let x=cx-nw/2+(c+.5)*nw/nc;if(I.pairs)x+=(i%2?2.6:-2.6);return x;};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(I.n)} kafası ve burguları">`;
  s+=`<path class="g-neck" d="M${cx-nw/2-4} ${yN} L${cx+nw/2+4} ${yN} L${cx+nw/2+10} ${H} L${cx-nw/2-10} ${H} Z"/>`;
  [yN+40,yN+80].forEach(y=>{const hw=nw/2+4+(y-yN)/(H-yN)*6;s+=`<line class="g-fret" x1="${cx-hw}" x2="${cx+hw}" y1="${y}" y2="${y}"/>`;});
  s+=`<path class="g-head" d="M${xL} ${y0+28} Q${xL} ${y0} ${xL+28} ${y0} L${xR-28} ${y0} Q${xR} ${y0} ${xR} ${y0+28} L${xR} ${yN-64} L${cx+nw/2+4} ${yN} L${cx-nw/2-4} ${yN} L${xL} ${yN-64} Z"/>`;
  if(I.shape==='slot'){
    s+=`<rect class="g-slot" x="${xL+13}" y="${yA-24}" width="18" height="${yB-yA+48}" rx="9"/><rect class="g-slot" x="${xR-31}" y="${yA-24}" width="18" height="${yB-yA+48}" rx="9"/>`;
  }
  s+=`<rect class="g-nut" x="${cx-nw/2-4}" y="${yN-4}" width="${nw+8}" height="7" rx="2"/>`;
  for(let i=0;i<n;i++){
    const c=course(I,i), P=peg[i];
    let w=(I.bass?2.8:2.1)-(I.bass?1.2:1.3)*c/Math.max(nc-1,1);
    if(I.pairs&&T.m[i]>T.m[i^1]) w*=.6;
    s+=`<polyline class="g-str${i===sel?' on':''}" stroke-width="${w.toFixed(2)}" points="${P.px},${P.y} ${nutX(i).toFixed(1)},${yN} ${nutX(i).toFixed(1)},${H}"/>`;
  }
  for(let i=0;i<n;i++){const P=peg[i];s+=`<line class="g-shaft" x1="${P.kx}" x2="${P.px}" y1="${P.y}" y2="${P.y}"/>`;}
  for(let i=0;i<n;i++){const P=peg[i];s+=`<circle class="g-post" cx="${P.px}" cy="${P.y}" r="4.5"/>`;}
  const fs=Math.max(10,Math.min(16,r*.78));
  for(let i=0;i<n;i++){
    const P=peg[i], m=T.m[i];
    s+=`<g class="peg${i===sel?' on':''}" data-act="peg" data-v="${i}" role="button" tabindex="0" aria-pressed="${i===sel}" aria-label="${strLabel(I,T,i)} ${nm(m)}${Math.floor(m/12)-1}">`+
       `<circle class="halo" cx="${P.kx}" cy="${P.y}" r="${r}"/><circle class="pk" cx="${P.kx}" cy="${P.y}" r="${r}"/>`+
       `<text class="pt" x="${P.kx-fs*.12}" y="${P.y}" font-size="${fs.toFixed(1)}">${noteOct(m)}</text></g>`;
  }
  return s+'</svg>';
}
/* Çalgı ikonu: kafa ve burguların dizilişi (3+3, tek sıra, 6+6, 2+2…). */
function instIcon(I){
  const inline=I.shape==='inline', nL=I.L.length, nR=I.R.length, maxN=Math.max(nL,nR);
  const hx0=inline?17:13, hx1=inline?31:29, y0=3, y1=33;
  const pr=maxN>5?1.6:maxN>3?2.1:2.6, ya=y0+5, yb=y1-5;
  const yAt=(k,j)=>k===1?(ya+yb)/2:ya+j*(yb-ya)/(k-1);
  let s=`<svg viewBox="0 0 44 50" role="img" aria-label="${esc(I.n)}"><path class="ico-head" d="M${hx0} ${y0+5}Q${hx0} ${y0} ${hx0+5} ${y0}L${hx1-5} ${y0}Q${hx1} ${y0} ${hx1} ${y0+5}L${hx1} ${y1-4}L${hx1-3} ${y1+2}L${hx0+3} ${y1+2}L${hx0} ${y1-4}Z"/>`;
  s+=`<rect class="ico-neck" x="${(hx0+hx1)/2-4}" y="${y1+2}" width="8" height="${50-y1-2}" rx="1"/>`;
  for(let j=0;j<nL;j++) s+=`<circle class="ico-peg" cx="${hx0-4}" cy="${yAt(nL,j)}" r="${pr}"/>`;
  for(let j=0;j<nR;j++) s+=`<circle class="ico-peg" cx="${hx1+4}" cy="${yAt(nR,j)}" r="${pr}"/>`;
  return s+'</svg>';
}

let ac=null,master=null,unlocked=false;
/* iOS'ta sessiz modda Web Audio susar; kısa bir sessiz ses çalmak oturumu "oynatma" kipine alır. */
function unlock(){
  if(unlocked) return; unlocked=true;
  try{
    const n=800,b=new Uint8Array(44+n),dv=new DataView(b.buffer);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};

    dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);b.fill(128,44);
    let s='';b.forEach(x=>{s+=String.fromCharCode(x);});
    const a=new Audio('data:audio/wav;base64,'+btoa(s)); a.play().catch(()=>{});
  }catch(e){}
}
function ensureAudio(){
  try{

    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();

}
['pointerup','touchend','click'].forEach(t=>document.addEventListener(t,ensureAudio,{passive:true}));

function pluckAt(i,fret,t,peak,len){

    const hz=440*Math.pow(2,(MIDI[i]+fret-69)/12), dur=len||2.6-i*.18;
    const g=ac.createGain(), lp=ac.createBiquadFilter();

    g.gain.setValueAtTime(.0001,t);

    g.gain.exponentialRampToValueAtTime(.0001,t+dur);

      const o=ac.createOscillator(), og=ac.createGain();

}
const pluck=(i,fret,delay)=>{if(ac) pluckAt(i,fret,ac.currentTime+.005+(delay||0),.34);};
function buzz(svg,i){

/* Akor şemasında tel i'nin x konumu: 52 + 30·sıra (viewBox genişliği 240) */
const strX=i=>52+30*(state.lefty?5-i:i);

function hit(svg,from,to){

  const v=voicings(+box.dataset.r,box.dataset.q)[+box.dataset.vi]; if(!v) return;
  const idx=[];
  for(let i=0;i<6;i++){const X=strX(i);if((from<X&&to>=X)||(from>X&&to<=X)) idx.push(i);}
  idx.sort((a,b)=>to>from?strX(a)-strX(b):strX(b)-strX(a));

document.addEventListener('pointerdown',e=>{

let tone=null;
function startTone(i){

    const hz=midiHz(curTun().m[i],state.a4), now=ac.currentTime;
    const g=ac.createGain();

function songChords(text){
  const out=[];
  text.replace(/\[([^\]]{1,12})\]/g,(m,c)=>{const p=parseTok(c.trim());if(p) out.push(p);return m;});
  text.split('\n').forEach(line=>{
    if(line.includes('[')) return;
    const t=line.trim().split(/\s+/).filter(Boolean);
    if(t.length&&t.every(x=>parseTok(x))) t.forEach(x=>out.push(parseTok(x)));
  });
  return out;
}
const shiftName=(c,sh)=>nm(c.r+sh)+esc(c.suf)+(c.b==null?'':'/'+nm(c.b+sh));
function lyricsHTML(text,sh){
  return text.split('\n').map(line=>{
    if(!line.trim()) return '<div class="lgap"></div>';
    if(line.includes('[')){
      const parts=line.split(/\[([^\]]{0,12})\]/);
      let h='<div class="lline">';
      if(parts[0]) h+=`<span class="lseg"><span class="ch ph"></span><span class="tx">${esc(parts[0])}</span></span>`;
      for(let i=1;i<parts.length;i+=2){
        const c=parseTok((parts[i]||'').trim()), tx=parts[i+1]||'';
        const ch=c?`<button class="ch" data-act="chord" data-root="${mod(c.r+sh,12)}" data-q="${c.q}">${shiftName(c,sh)}</button>`:`<span class="ch plain">${esc(parts[i])}</span>`;
        h+=`<span class="lseg">${ch}<span class="tx">${tx?esc(tx):'&nbsp;'}</span></span>`;
      }
      return h+'</div>';
    }
    const toks=line.trim().split(/\s+/);
    if(toks.every(t=>parseTok(t))) return '<div class="srow">'+toks.map(t=>{const c=parseTok(t);return `<button class="cchip" data-act="chord" data-root="${mod(c.r+sh,12)}" data-q="${c.q}">${shiftName(c,sh)}</button>`;}).join('')+'</div>';
    return `<div class="lline">${esc(line)}</div>`;
  }).join('');
}
function capoAdvice(chs){
  const uniq=[...new Map(chs.map(c=>[c.r+'|'+c.q,c])).values()];
  const score=k=>uniq.filter(c=>OPENKEYS.has(mod(c.r-k,12)+'|'+c.q)).length;
  let best=0; for(let k=1;k<=7;k++) if(score(k)>score(best)) best=k;
  return {best,score,total:uniq.length};
}
function songSummary(s){
  const u=[...new Map(songChords(s.text).map(c=>[c.r+'|'+c.q,c])).values()].slice(0,6);
  return u.length?u.map(c=>shiftName(c,s.tr)).join(' · '):'Akor yok';
}
const stepperHTML=(act,lab)=>`<span class="stepper"><button data-act="${act}" data-v="-1" aria-label="${lab} azalt">−</button><button data-act="${act}" data-v="1" aria-label="${lab} artır">+</button></span>`;
function renderSongs(){
  const el=$('#tab-sarki'), s=curSong();
  if(!s){
    const rows=state.songs.map(x=>`<button class="lrow" data-act="opensong" data-v="${esc(x.id)}"><span class="lt2"><b>${esc(x.title||'Adsız şarkı')}</b><small>${songSummary(x)}</small></span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>`).join('');
    el.innerHTML=`<header class="nav"><h1 class="lt">Şarkılar</h1><div class="navr"><button class="iconbtn" data-act="newsong" aria-label="Yeni şarkı"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>${GEAR}</div></header>`+
      tip('sarki','Akoru sözün önüne köşeli parantezle yaz: [Am]Akşam iner. Sadece akorlardan oluşan satırlar da olur: Am F C G')+
      (rows?`<div class="group">${rows}</div>`:`<div class="card"><p class="empty">Henüz şarkı yok. Sağ üstteki + ile ilkini ekle.</p></div>`);
    return;
  }
  const back=`<button class="back" data-act="songs">${CHEV_L}Şarkılar</button>`;
  if(state.editing){
    el.innerHTML=`<div class="navbar">${back}<button class="link" data-act="donesong" style="font-weight:600">Bitti</button></div>
      <div class="group"><input id="sTitle" class="tin" value="${esc(s.title)}" placeholder="Şarkı adı" autocomplete="off" aria-label="Şarkı adı"></div>
      <div class="group"><textarea id="sText" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Sözler ve akorlar" placeholder="[Am]Akşam iner [F]sahile yavaş">${esc(s.text)}</textarea></div>
      <p class="foot">Akoru sözün önüne köşeli parantezle yaz: [Am]Akşam iner. Sadece akorlardan oluşan satırlar ayrı düğmeler olarak görünür.</p>
      <div class="group"><div class="row"><span>Tempo</span><span class="right"><output>♩ ${s.bpm}</output>${stepperHTML('sbpm','Tempoyu')}</span></div></div>
      <button class="danger" data-act="delsong">Şarkıyı sil</button>`;
    return;
  }
  const chs=songChords(s.text).map(c=>({r:mod(c.r+s.tr,12),q:c.q}));
  const adv=capoAdvice(chs), sh=s.tr-s.capo;
  const sugg=chs.length&&adv.best!==s.capo&&adv.score(adv.best)>adv.score(s.capo)?`<small>Öneri: ${adv.best?adv.best+'. perde':'kapo yok'} · ${adv.score(adv.best)}/${adv.total} açık akor</small>`:'';
  el.innerHTML=`<div class="navbar">${back}<button class="link" data-act="editsong">Düzenle</button></div>
    <h1 class="lt">${esc(s.title||'Adsız şarkı')}</h1>
    <div class="group">
      <div class="row"><span>Ton</span><span class="right"><output>${s.tr>0?'+'+s.tr:s.tr}</output>${stepperHTML('tr','Tonu')}</span></div>
      <div class="row"><span class="lbl2">Kapo${sugg}</span><span class="right"><output>${s.capo?s.capo+'. perde':'Yok'}</output>${stepperHTML('capo','Kapoyu')}</span></div>
      <div class="row"><span>Tempo</span><span class="right"><output>♩ ${s.bpm}</output><button class="link" data-act="usebpm">Metronoma aktar</button></span></div>
      <div class="row"><span>Otomatik kaydır</span><span class="right"><output>Hız ${state.autoSp}</output>${stepperHTML('autosp','Hızı')}<button class="playbtn${state.auto?' on':''}" data-act="auto" aria-label="${state.auto?'Kaydırmayı durdur':'Kaydırmayı başlat'}">${state.auto?ICON_STOP:ICON_PLAY}</button></span></div>
    </div>
    <div class="group pad lyrics">${s.capo?`<span class="capotag">Kapo ${s.capo}. perde · şekiller gösteriliyor</span>`:''}${s.text.trim()?lyricsHTML(s.text,sh):'<p class="empty">Bu şarkı boş. Düzenle\'ye dokunup söz ve akor ekle.</p>'}</div>`;
}
const AUTOSP=[0,12,20,30,44,62];
let autoRaf=null,autoLast=0,autoAcc=0;
function autoStep(now){
  if(!state.auto) return;
  const dt=Math.min(.1,(now-autoLast)/1000); autoLast=now;
  autoAcc+=AUTOSP[state.autoSp]*dt;
  const d=Math.floor(autoAcc);
  if(d>=1){window.scrollBy(0,d);autoAcc-=d;}
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2){autoStop();return;}
  autoRaf=requestAnimationFrame(autoStep);
}
function autoStart(){state.auto=true;autoLast=performance.now();autoAcc=0;autoRaf=requestAnimationFrame(autoStep);renderSongs();}
function autoStop(){if(!state.auto) return;state.auto=false;cancelAnimationFrame(autoRaf);if(state.tab==='sarki') renderSongs();}

/* ---------- Alt sayfa ---------- */
function renderSheet(){
  const k=state.sheet; if(!k) return;
  let title='',body='';
  if(k==='metro'){title='Metronom';body=metroSheet();}
  else if(k==='settings'){
    title='Ayarlar';
    const t=(id,lab,on)=>`<div class="row"><span id="ls-${id}">${lab}</span><button class="toggle" role="switch" aria-labelledby="ls-${id}" aria-checked="${on}" data-act="set" data-v="${id}"><i></i></button></div>`;
    body=`<div class="group">${t('solfege','Do Re Mi yazımı',state.solfege)}${t('flat','Bemol (♭) kullan',state.flat)}${t('lefty','Solak modu',state.lefty)}${t('awake','Ekran açık kalsın',state.awake)}</div>
      <p class="foot">Solak modunda akor şemaları ve klavye aynalanır. Ekran açık kalsın açıkken uygulama önündeyken telefon kararmaz.</p>
      <p class="foot">Şarkıların ve ayarların sadece bu cihazda saklanır.</p>`;
  }
  else if(k==='chord'){
    const c=state.sc, vs=voicings(c.r,c.q); c.vi=clamp(c.vi,0,Math.max(vs.length-1,0));
    const v=vs[c.vi], Q=QBY[c.q], labs=shapeLabels(vs);
    title=chordName(c.r,c.q);
    const notes=Q.iv.map(i=>`<span class="note${i===0?' r':''}">${nm(c.r+i)}</span>`).join('');
    body=`<div class="card"><div class="csub" style="text-align:center;margin:0">${nm(c.r)} ${Q.tr}</div><div class="cnotes" style="justify-content:center;margin:0">${notes}</div>`+
      (v?strumBox(c.r,c.q,c.vi,diagram(v,c.r).svg)+`<div class="vnav"><button class="nb" data-act="svi" data-v="-1" aria-label="Önceki şekil" ${c.vi<=0?'disabled':''}>${CHEV_L}</button><div class="vlab"><strong>${labs[c.vi]}</strong><span>${c.vi+1} / ${vs.length} şekil</span></div><button class="nb" data-act="svi" data-v="1" aria-label="Sonraki şekil" ${c.vi>=vs.length-1?'disabled':''}>${CHEV_R}</button></div>`:'<p class="empty">Şema bulunamadı.</p>')+
      `</div><button class="fsbtn" data-act="open" data-root="${c.r}" data-q="${c.q}">Akorlar'da aç</button>`;
  }
  else if(k==='confirm'){
    const s=curSong(); title='Şarkıyı sil';
    body=`<p class="ctext">“${esc(s?s.title:'')}” silinsin mi? Bu işlem geri alınamaz.</p><div class="mbtns"><button class="tapbtn" data-act="closesheet">Vazgeç</button><button class="gobtn on" data-act="delconfirm">Sil</button></div>`;
  }
  $('#sheetTitle').textContent=title;
  $('#sheetBody').innerHTML=body;
  fixCars();
}
function openSheet(k){
  state.sheet=k; renderSheet();
  const w=$('#sheet'); w.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{w.classList.add('open');fixCars();}));
}
function closeSheet(){
  const w=$('#sheet'); w.classList.remove('open'); state.sheet=null;
  setTimeout(()=>{if(!state.sheet){w.hidden=true;$('#sheetBody').innerHTML='';}},reduceMotion()?0:340);
}

/* ---------- Ekran açık kalsın ---------- */
let wl=null;
async function keepAwake(){
  if(!state.awake||document.hidden||wl||!navigator.wakeLock) return;
  try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}catch(e){wl=null;}
}
function releaseAwake(){try{if(wl) wl.release();}catch(e){} wl=null;}
document.addEventListener('pointerup',()=>{keepAwake();},{passive:true});

/* ---------- Genel ---------- */
function renderTabs(){
  document.querySelectorAll('.tabbar [data-act="tab"]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===state.tab)));
  TABS.forEach(t=>{$('#tab-'+t).hidden=state.tab!==t;});
  setTimeout(fixCars,0);
}
function renderAll(){
  renderTuner();renderCard();renderRecent();renderTon();renderSongs();renderMbar();renderTabs();
  if(state.sheet) renderSheet();
  if(state.fs) renderFS();
}

/* Kaydırıcı tanımları */
const CARS={
  root:{get:()=>state.root,set:v=>{state.root=v;state.vi=0;},n:12,wrap:true,render:()=>{renderCard();renderMbar();noteRecent();}},
  q:{get:()=>QT.findIndex(x=>x.k===state.q),set:v=>{state.q=QT[v].k;state.vi=0;},n:QT.length,wrap:false,render:()=>{renderCard();renderMbar();noteRecent();}},
  vi:{get:()=>state.vi,set:v=>{state.vi=v;},get n(){return voicings(state.root,state.q).length;},wrap:false,render:()=>renderCard()},
  sroot:{get:()=>state.sRoot,set:v=>{state.sRoot=v;state.sPos=0;},n:12,wrap:true,render:()=>{renderTon();renderFS();}},
  stype:{get:()=>SCALES.findIndex(x=>x.k===state.sType),set:v=>{state.sType=SCALES[v].k;state.sPos=0;},n:SCALES.length,wrap:false,render:()=>{renderTon();renderFS();}},
  inst:{get:()=>INST.indexOf(curInst()),set:v=>{stopTone(false);state.inst=INST[v].k;state.tunI=0;},n:INST.length,wrap:false,render:()=>renderTuner()},
  tun:{get:()=>curInst().tun.indexOf(curTun()),set:v=>{stopTone(false);state.tunI=v;},get n(){return curInst().tun.length;},wrap:false,render:()=>renderTuner()},
  btprog:{get:()=>state.btProg,set:v=>{state.btProg=v;},get n(){return curProgs().length;},wrap:false,render:()=>{renderBT();renderMbar();}},
  btstyle:{get:()=>state.btStyle,set:v=>{state.btStyle=v;},n:STYLES.length,wrap:false,render:()=>{renderBT();renderMbar();}},
  pat:{get:()=>state.pat,set:v=>{state.pat=v;},get n(){return PATS[state.sig].length;},wrap:false,render:()=>{renderSheet();renderMbar();}}
};
function canStep(k,d){const c=CARS[k];if(!c) return false;const i=c.get()+d;return c.wrap||(i>=0&&i<c.n);}
/* d kadar ilerle. Sürüklerken (dragOff verilir) animasyonu parmak yönetir. */
function stepRoot(k,d,dragOff){
  const c=CARS[k]; if(!c||!d||!canStep(k,d)) return false;
  let i=c.get()+d; if(c.wrap) i=mod(i,c.n);
  if(dragOff!==undefined){tweens[k]=null;carOff[k]=dragOff;}
  c.set(i); c.render();
  if(dragOff===undefined){carOff[k]=d;fixCars();settle(k,d);}
  save(); return true;
}
let sw=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest&&e.target.closest('.car'); if(!c) return;
  const k=c.dataset.k; tweens[k]=null;
  sw={k,id:e.pointerId,x:e.clientX,x0:e.clientX,off:carOff[k]||0,t:performance.now(),v:0,p:e.target.closest('.ci')};
  try{c.closest('.sheet,main').setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id) return;
  const c=carEl(sw.k); if(!c||!c.clientWidth) return;
  const R=rpOf(c), cw=c.clientWidth/R.div;
  const now=performance.now(), dx=e.clientX-sw.x;
  sw.v=dx/Math.max(8,now-sw.t); sw.t=now; sw.x=e.clientX;
  sw.off+=dx/cw;
  while(sw.off<=-.5&&canStep(sw.k,1)){sw.off+=1;stepRoot(sw.k,1,sw.off);}
  while(sw.off>=.5&&canStep(sw.k,-1)){sw.off-=1;stepRoot(sw.k,-1,sw.off);}
  if(sw.off<0&&!canStep(sw.k,1)) sw.off=Math.max(sw.off,-.22);
  if(sw.off>0&&!canStep(sw.k,-1)) sw.off=Math.min(sw.off,.22);
  carOff[sw.k]=sw.off; const cc=carEl(sw.k); if(cc) layoutCar(cc,sw.off);
});
function endSwipe(e){
  if(!sw||e.pointerId!==sw.id) return;
  const s=sw; sw=null;
  if(Math.abs(e.clientX-s.x0)<6&&s.p&&+s.p.dataset.p!==0){stepRoot(s.k,+s.p.dataset.p);return;}
  let off=s.off;
  /* Kısa ama hızlı fiske de geçirir; parmak durduysa hız sayılmaz. */
  const recent=performance.now()-s.t<90, dir=Math.sign(e.clientX-s.x0);
  const fling=recent&&Math.abs(s.v)>.45&&Math.abs(off)>.06&&Math.sign(off)===Math.sign(s.v);
  if(((off<=-.28&&dir<0)||(fling&&s.v<0))&&canStep(s.k,1)){off+=1;stepRoot(s.k,1,off);}
  else if(((off>=.28&&dir>0)||(fling&&s.v>0))&&canStep(s.k,-1)){off-=1;stepRoot(s.k,-1,off);}
  carOff[s.k]=off; settle(s.k,off);
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',endSwipe);

function setChord(r,q){state.root=r;state.q=q in QBY?q:'';state.vi=0;renderCard();renderRecent();renderMbar();noteRecent();}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, s=curSong();
  switch(a){
    case 'tab':
      if(v==='sarki'&&state.tab==='sarki'){state.songId=null;state.editing=false;}
      if(v!=='akort') stopTone(false);
      autoStop(); state.tab=v; if(v==='sarki') renderSongs(); renderTuner(); renderTabs(); window.scrollTo(0,0); break;
    case 'settings': openSheet('settings'); break;
    case 'closesheet': closeSheet(); break;
    case 'set':
      state[v]=!state[v];
      if(v==='awake'){if(state.awake) keepAwake(); else releaseAwake();}
      renderAll(); break;
    case 'tip': state.tips[v]=true; renderAll(); break;
    case 'rstep': stepRoot(el.dataset.k,+v); break;
    case 'peg': togglePeg(+v); break;
    case 'a4': {state.a4=clamp(state.a4+(+v),430,450);const i=state.toneI;stopTone(false);if(i>=0) startTone(i);renderTuner();break;}
    case 'metro': if(bt.on) btStop(); else if(metro.on) metroStop(); else metroStart(); break;
    case 'bt': if(bt.on) btStop(); else btStart(); break;
    case 'btprog': state.btProg=+v; renderBT(); if(!bt.on) btStart(); else renderMbar(); window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'}); break;
    case 'metroopen': openSheet('metro'); break;
    case 'bpm': setBpm(state.bpm+(+v)); break;
    case 'sig': state.sig=v; state.pat=0; renderSheet(); renderMbar(); break;
    case 'tap': tapTempo(); break;
    case 'patchord': state.patChord=!state.patChord; renderSheet(); renderMbar(); break;
    case 'pick': setChord(+el.dataset.root,el.dataset.q); break;
    case 'chord': state.sc={r:+el.dataset.root,q:el.dataset.q in QBY?el.dataset.q:'',vi:0}; openSheet('chord'); break;
    case 'svi': if(state.sc){state.sc.vi+=+v;renderSheet();} break;
    case 'open':
      closeSheet(); stopTone(false); autoStop();
      state.tab='akorlar'; setChord(+el.dataset.root,el.dataset.q); renderTabs(); window.scrollTo(0,0); break;
    case 'spos': state.sPos=+v; renderTon(); renderFS(); break;
    case 'slab': state.sLab=v; renderTon(); renderFS(); break;
    case 'fs': openFS(); break;
    case 'fsclose': closeFS(); break;
    case 'fsflip': state.fsFlip=!state.fsFlip; renderFS(); break;
    case 'songs': autoStop(); state.songId=null; state.editing=false; renderSongs(); window.scrollTo(0,0); break;
    case 'opensong': state.songId=v; state.editing=false; renderSongs(); window.scrollTo(0,0); break;
    case 'newsong': {
      const id='s'+Date.now().toString(36);
      state.songs.unshift({id,title:'Yeni şarkı',text:'',tr:0,capo:0,bpm:90});
      state.songId=id; state.editing=true; renderSongs(); window.scrollTo(0,0);
      setTimeout(()=>{const t=$('#sTitle');if(t){t.focus();t.select();}},50); break;
    }
    case 'editsong': autoStop(); state.editing=true; renderSongs(); break;
    case 'donesong': state.editing=false; renderSongs(); break;
    case 'delsong': openSheet('confirm'); break;
    case 'delconfirm':
      state.songs=state.songs.filter(x=>x.id!==state.songId); state.songId=null; state.editing=false;
      closeSheet(); renderSongs(); break;
    case 'tr': if(s){s.tr=clamp(s.tr+(+v),-11,11);renderSongs();} break;
    case 'capo': if(s){s.capo=clamp(s.capo+(+v),0,9);renderSongs();} break;
    case 'sbpm': if(s){s.bpm=clamp(s.bpm+(+v)*2,30,240);renderSongs();} break;
    case 'usebpm': if(s){setBpm(s.bpm);} break;
    case 'autosp': state.autoSp=clamp(state.autoSp+(+v),1,5); renderSongs(); break;
    case 'auto': if(state.auto) autoStop(); else autoStart(); break;
  }
  save();
});
document.addEventListener('input',e=>{
  const s=curSong();
  if(e.target.id==='bpmRange'){setBpm(+e.target.value);save();}
  else if(s&&e.target.id==='sTitle'){s.title=e.target.value.slice(0,200);save();}
  else if(s&&e.target.id==='sText'){s.text=e.target.value.slice(0,20000);save();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(state.fs) closeFS(); else if(state.sheet) closeSheet(); return;}
  const g=e.target.closest&&e.target.closest('.peg');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();togglePeg(+g.dataset.v);}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){metroStop();btStop();stopTone(true);autoStop();}
  else keepAwake();
});
window.addEventListener('resize',fixCars);

load();
renderAll();
fixCars();
</script>
